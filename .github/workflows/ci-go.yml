name: CI (Go)
on:
  push: { branches: [main], paths: ['crawler/**'] }
  pull_request: { paths: ['crawler/**'] }

jobs:
  ci-go:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with: { go-version: '1.27' }

      - name: Run go vet
        working-directory: crawler
        run: go vet ./...

      - name: Run tests
        working-directory: crawler
        run: go test ./...
