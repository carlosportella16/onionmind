name: CI (Java)
on:
  push: { branches: [main] }
  pull_request: {}

jobs:
  ci-java:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '25' }

      - name: Run tests with coverage
        working-directory: core
        run: ./gradlew clean test jacocoTestReport -q

      - name: Check coverage threshold
        working-directory: core
        run: |
          LINE_COUNTER=$(grep -o '<counter type="LINE" missed="[0-9]*" covered="[0-9]*"/>' build/reports/jacoco/test/jacocoTestReport.xml | tail -1)
          MISSED=$(echo "$LINE_COUNTER" | grep -oP 'missed="\K[0-9]+')
          COVERED=$(echo "$LINE_COUNTER" | grep -oP 'covered="\K[0-9]+')
          COVERAGE=$(awk "BEGIN {printf \"%.0f\", ($COVERED / ($COVERED + $MISSED)) * 100}")
          echo "Coverage: $COVERAGE%"
          if [ "$COVERAGE" -lt 80 ]; then
            echo "❌ Coverage $COVERAGE% is below 80% threshold"
            exit 1
          fi
          echo "✓ Coverage $COVERAGE% meets 80% threshold"

  # The Cucumber acceptance suite already runs inside `test` above. This job boots the real
  # app against real Postgres/Kafka/Redis and runs the GET-only @smoke scenarios against it.
  # No Ollama/Qdrant/Neo4j on the runner, so @semantic and @grafo are excluded; ai.enabled=true still exposes
  # the AI metrics @ia checks (no API keys needed — no page gets enriched).
  smoke:
    needs: ci-java
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: onionmind
          POSTGRES_USER: onionmind
          POSTGRES_PASSWORD: onionmind_dev_only
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U onionmind" --health-interval 5s --health-retries 10
      kafka:
        image: apache/kafka-native:3.9.1
        ports: ['9092:9092']
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '25' }

      - name: Start core
        working-directory: core
        run: |
          ./gradlew bootJar -q
          nohup java -jar build/libs/core-0.0.1-SNAPSHOT.jar --ai.enabled=true > core.log 2>&1 &
          for _ in $(seq 1 60); do
            curl -sf http://localhost:8081/actuator/health > /dev/null && exit 0
            sleep 2
          done
          echo "core did not become healthy"; tail -100 core.log; exit 1

      - name: Run smoke tests
        working-directory: core
        env:
          SMOKE_TAGS: '@smoke and not @semantic and not @grafo'
        run: ./gradlew smokeTest

      - name: Core log on failure
        if: failure()
        working-directory: core
        run: tail -200 core.log
