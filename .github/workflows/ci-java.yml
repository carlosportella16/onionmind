name: CI (Java)
on:
  push: { branches: [main] }
  pull_request: {}

jobs:
  ci-java:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '25' }

      - name: Run tests with coverage
        working-directory: core
        run: ./gradlew clean test jacocoTestReport -q

      - name: Check coverage threshold
        working-directory: core
        run: |
          LINE_COUNTER=$(grep -o '<counter type="LINE" missed="[0-9]*" covered="[0-9]*"/>' build/reports/jacoco/test/jacocoTestReport.xml | tail -1)
          MISSED=$(echo "$LINE_COUNTER" | grep -oP 'missed="\K[0-9]+')
          COVERED=$(echo "$LINE_COUNTER" | grep -oP 'covered="\K[0-9]+')
          COVERAGE=$(awk "BEGIN {printf \"%.0f\", ($COVERED / ($COVERED + $MISSED)) * 100}")
          echo "Coverage: $COVERAGE%"
          if [ "$COVERAGE" -lt 80 ]; then
            echo "❌ Coverage $COVERAGE% is below 80% threshold"
            exit 1
          fi
          echo "✓ Coverage $COVERAGE% meets 80% threshold"
