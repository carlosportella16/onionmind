name: E2E smoke
on:
  push: { branches: [main] }
  pull_request: {}

jobs:
  # Fases 1-3 end to end: real crawler image -> Redpanda -> core -> Qdrant/AI, with Tor,
  # the .onion sites and the generation provider (DeepSeek) faked by crawler/cmd/e2e-fakes;
  # embeddings come from the real local model. Same script as locally.
  e2e-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '25', cache: gradle }

      # The local embedding model (~118 MB), mounted into the core by e2e-smoke.sh.
      - name: Cache embedding model
        uses: actions/cache@v4
        with:
          path: ~/.cache/onionmind/models
          key: embedding-model-${{ hashFiles('scripts/fetch-embedding-model.sh') }}

      - name: Run end-to-end smoke
        run: ./scripts/e2e-smoke.sh
