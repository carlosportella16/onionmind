name: E2E smoke
on:
  push: { branches: [main] }
  pull_request: {}

jobs:
  # Fases 1-3 end to end: real crawler image -> Redpanda -> core -> Qdrant/AI, with Tor,
  # the .onion sites and Ollama faked by crawler/cmd/e2e-fakes. Same script as locally.
  e2e-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '25', cache: gradle }

      - name: Run end-to-end smoke
        run: ./scripts/e2e-smoke.sh
