spring:
  application:
    name: onionmind-core
  datasource:
    url: jdbc:postgresql://localhost:5432/onionmind
    username: onionmind
    password: ${POSTGRES_PASSWORD:onionmind_dev_only}
  flyway:
    enabled: true
    locations: classpath:migrations
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: onionmind-ingestion
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      properties:
        spring.json.trusted.packages: "com.onionmind.ingestion"

server:
  port: 8081

# Phase 2: embeddings + semantic search (Cloudflare Workers AI fallback)
ollama:
  url: ${OLLAMA_URL:http://localhost:11434}
  model: nomic-embed-text
  timeout: 30s

qdrant:
  url: ${QDRANT_URL:localhost}
  port: ${QDRANT_PORT:6333}
  api-key: ${QDRANT_API_KEY:}
  collection: page_chunks
  vector-size: 768

embedding:
  enabled: false
  chunk-size: 512
  chunk-overlap-percent: 15
  batch-size: 100
