spring:
  application:
    name: onionmind-core
  datasource:
    url: jdbc:postgresql://localhost:5432/onionmind
    username: onionmind
    password: ${POSTGRES_PASSWORD:onionmind_dev_only}
  flyway:
    enabled: true
    locations: classpath:migrations
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: onionmind-ingestion
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      properties:
        spring.json.trusted.packages: "com.onionmind.ingestion"

server:
  port: 8081

# Phase 2: embeddings + semantic search (local ONNX model — see application.yml).
qdrant:
  url: ${QDRANT_URL:localhost}
  port: ${QDRANT_PORT:6333}
  api-key: ${QDRANT_API_KEY:}
  collection: ${QDRANT_COLLECTION:page_chunks_v3}
  vector-size: ${embedding.dimensions}

embedding:
  enabled: ${EMBEDDING_ENABLED:false}
  model: multilingual-e5-small-int8
  model-dir: ${EMBEDDING_MODEL_DIR:${user.home}/.cache/onionmind/models/multilingual-e5-small}
  threads: ${EMBEDDING_THREADS:2}
  dimensions: 384
  max-chars-per-page: 50000
  chunk-size: 400
  chunk-overlap-percent: 15
  batch-size: 100
  min-score: 0.45   # calibrated live 2026-09-06 (fase3-sdd sec 11.4/P2-2) — see application.yml

# Phase 3: same shape as application.yml, only enabled + keys differ per environment (fase3-sdd D1).
ai:
  enabled: ${AI_ENABLED:true}
  min-confidence: 0.7
  max-escalations: 2
  cache-ttl: 24h
  safety-margin-percent: 5
  interactive-reserve-percent: 30
  max-input-chars: 8000
  backfill:
    max-attempts: 5
  ladder: deepseek            # only providers approved for .onion text — see application.yml
  # Reactivate with a key of a project with billing (see application.yml):
  # providers:
  #   gemini: { requests-per-minute: 15, requests-per-day: 500, tokens-per-minute: 250000 }
  gemini:
    base-url: https://generativelanguage.googleapis.com/v1beta
    model: ${GEMINI_MODEL:gemini-3.5-flash-lite}
    api-key: ${GEMINI_API_KEY:}
  openai-compatible:
    deepseek:
      base-url: https://api.deepseek.com
      model: ${DEEPSEEK_MODEL:deepseek-flash}
      api-key: ${DEEPSEEK_API_KEY:}
      extra-body:
        "[response_format]": { type: json_object }
        thinking: { type: disabled }

illegal-content:
  url-denylist-path: ${ONION_DENYLIST_PATH:classpath:security/onion-denylist.txt}
  text-pattern-path: ${ILLEGAL_TEXT_PATTERN_PATH:classpath:security/illegal-text-patterns.txt}
  quarantine-retention-days: 30

# Phase 4: same shape as application.yml; Neo4j credentials (AuraDB) come from env.
graph:
  enabled: ${GRAPH_ENABLED:false}
