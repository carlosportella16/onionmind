spring:
  application:
    name: onionmind-core
  datasource:
    url: jdbc:postgresql://localhost:5432/onionmind
    username: onionmind
    password: ${POSTGRES_PASSWORD:onionmind_dev_only}
  flyway:
    enabled: true
    locations: classpath:migrations
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: onionmind-ingestion
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      properties:
        spring.json.trusted.packages: "com.onionmind.ingestion"

server:
  port: 8081

# Phase 2: embeddings + semantic search (Cloudflare Workers AI fallback)
ollama:
  url: ${OLLAMA_URL:http://localhost:11434}
  model: nomic-embed-text
  timeout: 30s

qdrant:
  url: ${QDRANT_URL:localhost}
  port: ${QDRANT_PORT:6333}
  api-key: ${QDRANT_API_KEY:}
  collection: page_chunks
  vector-size: 768

embedding:
  enabled: ${EMBEDDING_ENABLED:false}
  chunk-size: 512
  chunk-overlap-percent: 15
  batch-size: 100
  min-score: 0.45   # calibrated live 2026-09-06 (fase3-sdd sec 11.4/P2-2) — see application.yml

# Phase 3: same shape as application.yml, only enabled + keys differ per environment (fase3-sdd D1).
ai:
  enabled: ${AI_ENABLED:true}
  min-confidence: 0.7
  max-escalations: 2
  cache-ttl: 24h
  safety-margin-percent: 5
  ollama:
    generate-model: ${OLLAMA_GENERATE_MODEL:llama3.1:8b}
    timeout: 120s
  groq:
    base-url: https://api.groq.com/openai/v1
    model: ${GROQ_MODEL:openai/gpt-oss-120b}   # llama-3.3-70b-versatile was decommissioned by Groq (validated live Sep 2026)
    api-key: ${GROQ_API_KEY:}
    daily-limit: 14400
    minute-limit: 30
  gemini:
    base-url: https://generativelanguage.googleapis.com/v1beta
    model: ${GEMINI_MODEL:gemini-2.5-flash}
    api-key: ${GEMINI_API_KEY:}
    daily-limit: 1500
    minute-limit: 15

illegal-content:
  url-denylist-path: ${ONION_DENYLIST_PATH:classpath:security/onion-denylist.txt}
  text-pattern-path: ${ILLEGAL_TEXT_PATTERN_PATH:classpath:security/illegal-text-patterns.txt}
  quarantine-retention-days: 30
