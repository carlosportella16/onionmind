# Sandbox profile — identical to default for Fase 1
spring:
  application:
    name: onionmind-core
  datasource:
    url: jdbc:postgresql://localhost:5432/onionmind
    username: onionmind
    password: ${POSTGRES_PASSWORD:onionmind_dev_only}
  flyway:
    enabled: true
    locations: classpath:migrations

server:
  port: 8081
