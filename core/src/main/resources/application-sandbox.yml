# Sandbox profile — local dev. Inherits the ollama/qdrant/embedding/ai blocks from
# application.yml; only the enable flags differ here (fase3-sdd D1). To exercise the
# real pipeline locally, flip these to true and have the services + API keys in place.
spring:
  application:
    name: onionmind-core
  datasource:
    url: jdbc:postgresql://localhost:5432/onionmind
    username: onionmind
    password: ${POSTGRES_PASSWORD:onionmind_dev_only}
  flyway:
    enabled: true
    locations: classpath:migrations
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: onionmind-ingestion
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      properties:
        spring.json.trusted.packages: "com.onionmind.ingestion"

server:
  port: 8081

embedding:
  enabled: false

ai:
  enabled: false
