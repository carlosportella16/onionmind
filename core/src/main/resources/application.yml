spring:
  application:
    name: onionmind-core
  datasource:
    url: jdbc:postgresql://localhost:5432/onionmind
    username: onionmind
    password: ${POSTGRES_PASSWORD:onionmind_dev_only}
  flyway:
    enabled: true
    locations: classpath:migrations

server:
  port: 8081

# Phase 2: embeddings + semantic search
ollama:
  url: http://localhost:11434
  model: nomic-embed-text
  timeout: 30s

qdrant:
  url: localhost
  port: 6333
  api-key: ${QDRANT_API_KEY:}
  collection: page_chunks
  vector-size: 768

embedding:
  enabled: true
  chunk-size: 512
  chunk-overlap-percent: 15
  batch-size: 10
