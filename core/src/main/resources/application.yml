spring:
  application:
    name: onionmind-core
  task:
    scheduling:
      pool:
        # Default is 1 — every @Scheduled bean shares one thread. Sized for the two that
        # exist today (AiEnrichmentBackfillJob, EmbeddingBackfillJob) so one's long run can
        # never block the other's turn (fix-large-page-backfill-limits, found live
        # 2026-09-07: a 13-minute EmbeddingBackfillJob run starved AiEnrichmentBackfillJob
        # completely). Phase 4 adds ChangeSummaryJob and EventResubmissionJob — one thread
        # per job, so none can starve another.
        size: 4
    execution:
      pool:
        # Runs the async @ApplicationModuleListeners (Phase 4). The queue is unbounded, so
        # core-size is the real ceiling — it caps concurrent Postgres/Neo4j work from events.
        core-size: 4
  datasource:
    url: jdbc:postgresql://localhost:5432/onionmind
    username: onionmind
    password: ${POSTGRES_PASSWORD:onionmind_dev_only}
    hikari:
      # Fase 2+: full-text e vetorial passaram a rodar em paralelo por request
      # (SearchController) — sem teto, uma query patológica em qualquer um dos
      # dois trava a request inteira (master-sdd sec. 9).
      connection-init-sql: "SET statement_timeout = 2000"
  flyway:
    enabled: true
    locations: classpath:migrations
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: onionmind-ingestion
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      properties:
        spring.json.trusted.packages: "com.onionmind.ingestion"
        # Default (1MiB) can't fetch a message the broker now accepts up to 12MiB
        # (fix-ingestion-stability) — matches docker-compose's redpanda.kafka_batch_max_bytes.
        max.partition.fetch.bytes: 12582912
        # Defense-in-depth, not the fix (fix-ingestion-stability): IngestionPipeline no longer
        # runs AI/embedding inline, so this listener should never approach the 300s default —
        # raised anyway in case some future change puts real work back on this thread.
        max.poll.interval.ms: 600000
  data:
    redis:
      # Phase 3: quota counters + AI response cache. Same instance the crawler uses
      # for dedup — keyspaces are prefix-isolated (quota:* / ai-cache:* vs dedup:*).
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  modulith:
    events:
      jdbc:
        # P2-5: creates the event_publication table so shutdown doesn't throw
        # BadSqlGrammarException.
        schema-initialization:
          enabled: true
      # Phase 4 (ADR-009): PageEnrichedEvent / PageQuarantinedEvent. Outstanding ones are
      # redelivered on start (EventResubmissionJob covers the running app); completed ones
      # are deleted so the registry never grows without bound.
      republish-outstanding-events-on-restart: true
      completion-mode: delete
  neo4j:
    uri: ${NEO4J_URI:bolt://localhost:7687}
    authentication:
      username: ${NEO4J_USERNAME:neo4j}
      password: ${NEO4J_PASSWORD:onionmind_dev_only}

server:
  port: 8081

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, prometheus
  endpoint:
    health:
      show-details: when-authorized
  health:
    neo4j:
      # Neo4j is optional (graph.enabled) — a missing graph must not mark the app DOWN.
      enabled: ${graph.enabled:false}

# Phase 2: embeddings + semantic search. Embeddings come from Gemini (ai.gemini.base-url /
# api-key), paid tier, even with ai.enabled off (replace-ollama-with-gemini-deepseek D6).
qdrant:
  url: localhost
  port: 6333
  api-key: ${QDRANT_API_KEY:}
  # One collection per embedding model, so vectors never mix (D7). The old nomic-embed-text
  # collection (page_chunks) is left alone until deleted by hand — see README.
  collection: page_chunks_v2
  vector-size: ${embedding.dimensions}

embedding:
  enabled: false
  model: gemini-embedding-2      # multilingual: Portuguese queries against an English corpus
  dimensions: 768                # outputDimensionality; Gemini normalizes truncated vectors itself
  request-batch-size: 100        # texts per batchEmbedContents call (no documented maximum)
  max-chars-per-page: 50000      # only the start of a page is embedded: a 1.3 MB listing is ~25 chunks
  chunk-size: 512
  chunk-overlap-percent: 15
  batch-size: 10                 # pages per EmbeddingBackfillJob run
  backfill-interval-ms: 300000
  # Cosine similarity floor for semantic search hits — Qdrant's k-NN always returns topK
  # nearest points even when nothing is actually relevant (small corpus, unrelated query).
  # Calibrated live 2026-09-06 (fase3-sdd sec 11.4/P2-2) against real nomic-embed-text +
  # Qdrant: across 7 queries / ~1600 candidate chunks, p50=0.39, p90=0.485, gibberish/noise
  # topped out at ~0.52, genuine concept-level (paraphrased, no literal term overlap) matches
  # landed ~0.47, direct on-topic matches scored 0.63+. 0.35 was barely above the median —
  # it filtered almost nothing. 0.45 keeps concept-level and direct matches while cutting most
  # of the noise floor. Known gap: one degenerate page (a raw link-list with hundreds of
  # near-duplicate chunks) scores ~0.49-0.52 against nearly any query, including gibberish —
  # no min-score value separates that from a genuine paraphrase match without also losing the
  # paraphrase; the real fix is a content-quality gate before embedding, not this number.
  # These numbers are nomic-embed-text's: recalibrate for gemini-embedding-2 with the same
  # procedure (replace-ollama-with-gemini-deepseek D8, task 5.3) before trusting 0.45.
  min-score: 0.45

# Phase 3: generative AI (summarize / classify / translate). Separate from embedding.enabled
# so embeddings and generation can roll out independently (fase3-sdd sec. 8, D1).
ai:
  enabled: false
  min-confidence: 0.7          # below this the ValidationDecorator escalates to the next provider
  max-escalations: 2           # provider switches before giving up (returns best result, no throw)
  cache-ttl: 24h               # CacheDecorator, keyed by (text hash, task type) — not provider
  safety-margin-percent: 5     # keep this far below each cloud provider's published daily limit
  interactive-reserve-percent: 30  # share of each provider's budget batch tasks may not use (ai-token-quota D4)
  max-input-chars: 8000        # page text sent to the LLM by the order 10-40 processors (fix-real-infra-findings D1)
  retry:
    max-retries: 2             # same-provider retries on a transient transport failure
    backoff: 200ms
  backfill:
    batch-size: 20             # pages per scheduled run of AiEnrichmentBackfillJob
    interval-ms: 300000
    max-attempts: 5            # failed runs before a page goes failed_permanent; new content resets it
  # One ladder for every task, cheapest first (replace-ollama-with-gemini-deepseek D3). Only
  # paid providers: .onion content must not reach a free tier that trains on it (2026-10-24).
  ladder: gemini,deepseek
  # Request and token ceilings per provider id (ai-token-quota D5); a ceiling left out is not
  # tracked. A provider without an entry (deepseek) is never gated by quota — its prepaid
  # balance is the spending cap, and a 402 parks it (D5).
  providers:
    # Placeholders for the paid tier: the real per-project numbers are only shown in AI Studio,
    # not published (ai.google.dev rate-limits, updated 2026-10-15) — confirm before production.
    gemini: { requests-per-minute: 1000, requests-per-day: 10000, tokens-per-minute: 1000000, tokens-per-day: 20000000 }
  gemini:
    base-url: https://generativelanguage.googleapis.com/v1beta
    # gemini-2.5-flash-lite is closed to new users (HTTP 404, 2026-10-24); 3.5 Flash-Lite is what
    # the API points to. US$ 0.30 / 2.50 per 1M tokens, thinking at its minimal level.
    model: gemini-3.5-flash-lite
    api-key: ${GEMINI_API_KEY:}    # key of a project WITH billing — never a free-tier key
  # OpenAI-compatible providers, one bean per id (D1). extra-body goes into every request.
  openai-compatible:
    deepseek:
      base-url: https://api.deepseek.com
      model: deepseek-flash
      api-key: ${DEEPSEEK_API_KEY:}
      extra-body:
        "[response_format]": { type: json_object }
        thinking: { type: disabled }

illegal-content:
  # Curated lists live outside the repo (audited separately, fase3-sdd sec. 7.5, D3).
  # The classpath files are placeholders so the guard boots; populate on deploy.
  url-denylist-path: classpath:security/onion-denylist.txt
  text-pattern-path: classpath:security/illegal-text-patterns.txt
  quarantine-retention-days: 30

# Phase 4: knowledge graph (Neo4j). Off by default like embedding.enabled — with it off the
# app never talks to Neo4j and /api/entities does not exist.
graph:
  enabled: false

# Phase 4: EntityProcessor (order 50). Runs with ai.enabled, like the other AI processors.
entities:
  max-input-chars: 8000        # text sent to the LLM for named entities (regex sees it all)
  max-per-page: 200            # also bounds the PageEnrichedEvent payload

# Phase 4: change detection between versions. Runs with ai.enabled.
intelligence:
  diff:
    min-changed-chars: 40      # below this (and no entity/category change) a change is trivial
    max-text-chars: 4000       # added/removed text kept per change and sent to the summarizer
  summary:
    batch-size: 20
    interval-ms: 300000
    max-attempts: 3

events:
  resubmit-after: 10m          # incomplete event publications older than this are redelivered
  resubmit-interval-ms: 300000
