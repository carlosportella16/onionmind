spring:
  application:
    name: onionmind-core
  datasource:
    url: jdbc:postgresql://localhost:5432/onionmind
    username: onionmind
    password: ${POSTGRES_PASSWORD:onionmind_dev_only}
    hikari:
      # Fase 2+: full-text e vetorial passaram a rodar em paralelo por request
      # (SearchController) — sem teto, uma query patológica em qualquer um dos
      # dois trava a request inteira (master-sdd sec. 9).
      connection-init-sql: "SET statement_timeout = 2000"
  flyway:
    enabled: true
    locations: classpath:migrations
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: onionmind-ingestion
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      properties:
        spring.json.trusted.packages: "com.onionmind.ingestion"
  data:
    redis:
      # Phase 3: quota counters + AI response cache. Same instance the crawler uses
      # for dedup — keyspaces are prefix-isolated (quota:* / ai-cache:* vs dedup:*).
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  # Phase 4: Event Publication Registry (ADR-009, note P2-5 in fase3-sdd) — durability across
  # a restart mid-publication. Schema comes from db/migrations/V6__event_publication.sql, not
  # from Modulith's own schema-initialization flag (this project uses Flyway for every table).
  modulith:
    events:
      republish-outstanding-events-on-restart: true

server:
  port: 8081

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, prometheus
  endpoint:
    health:
      show-details: when-authorized

# Phase 2: embeddings + semantic search
ollama:
  url: http://localhost:11434
  model: nomic-embed-text
  timeout: 30s

qdrant:
  url: localhost
  port: 6333
  api-key: ${QDRANT_API_KEY:}
  collection: page_chunks
  vector-size: 768

embedding:
  enabled: false
  chunk-size: 512
  chunk-overlap-percent: 15
  batch-size: 10
  backfill-interval-ms: 300000
  # Cosine similarity floor for semantic search hits — Qdrant's k-NN always returns topK
  # nearest points even when nothing is actually relevant (small corpus, unrelated query).
  # nomic-embed-text on short/generic text clusters tightly (~0.4-0.5 even for unrelated
  # pairs), so this must stay low enough to not false-negative real matches — tune per
  # embedding model/corpus, this is a floor not a curated relevance score.
  min-score: 0.35

# Phase 3: generative AI (summarize / classify / translate). Separate from embedding.enabled
# so embeddings and generation can roll out independently (fase3-sdd sec. 8, D1).
ai:
  enabled: false
  min-confidence: 0.7          # below this the ValidationDecorator escalates to the next provider
  max-escalations: 2           # provider switches before giving up (returns best result, no throw)
  cache-ttl: 24h               # CacheDecorator, keyed by (text hash, task type) — not provider
  safety-margin-percent: 5     # keep this far below each cloud provider's published daily limit
  retry:
    max-retries: 2             # same-provider retries on a transient transport failure
    backoff: 200ms
  backfill:
    batch-size: 20             # pages per scheduled run of AiEnrichmentBackfillJob
    interval-ms: 300000
  ollama:
    generate-model: llama3.1:8b
    timeout: 120s              # local generation on a small VM is slow
  groq:
    base-url: https://api.groq.com/openai/v1
    model: llama-3.3-70b-versatile
    api-key: ${GROQ_API_KEY:}
    daily-limit: 14400
    minute-limit: 30
  gemini:
    base-url: https://generativelanguage.googleapis.com/v1beta
    model: gemini-2.5-flash
    api-key: ${GEMINI_API_KEY:}
    daily-limit: 1500
    minute-limit: 15
  # Limits are August 2026 free-tier numbers (sdd sec. 9) — reconfirm before production.

illegal-content:
  # Curated lists live outside the repo (audited separately, fase3-sdd sec. 7.5, D3).
  # The classpath files are placeholders so the guard boots; populate on deploy.
  url-denylist-path: classpath:security/onion-denylist.txt
  text-pattern-path: classpath:security/illegal-text-patterns.txt
  quarantine-retention-days: 30

# Phase 4: housekeeping for the Event Publication Registry (ADR-009) — completed publications
# older than this are purged periodically, or the table grows without bound.
event-publication:
  retention-days: 7
  purge-interval-ms: 3600000

# Phase 4: knowledge graph (EntityProcessor + Neo4j AuraDB Free, master-sdd sec. 10). Independent
# on/off switch from ai.enabled/embedding.enabled — NoOpGraphStore covers graph.enabled=false.
graph:
  enabled: false

# Phase 4: diff-between-versions + rule-based alerts, both reacting to PageIndexedEvent.
# Independent flag — a deployment could run graph without intelligence or vice versa.
intelligence:
  enabled: false

neo4j:
  uri: ${NEO4J_URI:bolt://localhost:7687}
  username: ${NEO4J_USERNAME:neo4j}
  password: ${NEO4J_PASSWORD:onionmind_dev_only}
