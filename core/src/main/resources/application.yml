spring:
  application:
    name: onionmind-core
  datasource:
    url: jdbc:postgresql://localhost:5432/onionmind
    username: onionmind
    password: ${POSTGRES_PASSWORD:onionmind_dev_only}
    hikari:
      # Fase 2+: full-text e vetorial passaram a rodar em paralelo por request
      # (SearchController) — sem teto, uma query patológica em qualquer um dos
      # dois trava a request inteira (master-sdd sec. 9).
      connection-init-sql: "SET statement_timeout = 2000"
  flyway:
    enabled: true
    locations: classpath:migrations
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: onionmind-ingestion
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      properties:
        spring.json.trusted.packages: "com.onionmind.ingestion"
  data:
    redis:
      # Phase 3: quota counters + AI response cache. Same instance the crawler uses
      # for dedup — keyspaces are prefix-isolated (quota:* / ai-cache:* vs dedup:*).
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  modulith:
    events:
      jdbc:
        # P2-5: creates the event_publication table so shutdown doesn't throw
        # BadSqlGrammarException. No in-process events published yet (Phase 4 adds
        # PageIndexedEvent, ADR-009) — this just makes the registry's own table exist.
        schema-initialization:
          enabled: true

server:
  port: 8081

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, prometheus
  endpoint:
    health:
      show-details: when-authorized

# Phase 2: embeddings + semantic search
ollama:
  url: http://localhost:11434
  model: nomic-embed-text
  timeout: 30s

qdrant:
  url: localhost
  port: 6333
  api-key: ${QDRANT_API_KEY:}
  collection: page_chunks
  vector-size: 768

embedding:
  enabled: false
  chunk-size: 512
  chunk-overlap-percent: 15
  batch-size: 10
  backfill-interval-ms: 300000
  # Cosine similarity floor for semantic search hits — Qdrant's k-NN always returns topK
  # nearest points even when nothing is actually relevant (small corpus, unrelated query).
  # Calibrated live 2026-09-06 (fase3-sdd sec 11.4/P2-2) against real nomic-embed-text +
  # Qdrant: across 7 queries / ~1600 candidate chunks, p50=0.39, p90=0.485, gibberish/noise
  # topped out at ~0.52, genuine concept-level (paraphrased, no literal term overlap) matches
  # landed ~0.47, direct on-topic matches scored 0.63+. 0.35 was barely above the median —
  # it filtered almost nothing. 0.45 keeps concept-level and direct matches while cutting most
  # of the noise floor. Known gap: one degenerate page (a raw link-list with hundreds of
  # near-duplicate chunks) scores ~0.49-0.52 against nearly any query, including gibberish —
  # no min-score value separates that from a genuine paraphrase match without also losing the
  # paraphrase; the real fix is a content-quality gate before embedding, not this number.
  min-score: 0.45

# Phase 3: generative AI (summarize / classify / translate). Separate from embedding.enabled
# so embeddings and generation can roll out independently (fase3-sdd sec. 8, D1).
ai:
  enabled: false
  min-confidence: 0.7          # below this the ValidationDecorator escalates to the next provider
  max-escalations: 2           # provider switches before giving up (returns best result, no throw)
  cache-ttl: 24h               # CacheDecorator, keyed by (text hash, task type) — not provider
  safety-margin-percent: 5     # keep this far below each cloud provider's published daily limit
  retry:
    max-retries: 2             # same-provider retries on a transient transport failure
    backoff: 200ms
  backfill:
    batch-size: 20             # pages per scheduled run of AiEnrichmentBackfillJob
    interval-ms: 300000
  ollama:
    generate-model: llama3.1:8b
    timeout: 120s              # local generation on a small VM is slow
  groq:
    base-url: https://api.groq.com/openai/v1
    model: openai/gpt-oss-120b   # llama-3.3-70b-versatile was decommissioned by Groq (validated live Sep 2026)
    api-key: ${GROQ_API_KEY:}
    daily-limit: 14400
    minute-limit: 30
  gemini:
    base-url: https://generativelanguage.googleapis.com/v1beta
    model: gemini-2.5-flash
    api-key: ${GEMINI_API_KEY:}
    daily-limit: 1500
    minute-limit: 15
  # Limits are August 2026 free-tier numbers (sdd sec. 9) — reconfirm before production.

illegal-content:
  # Curated lists live outside the repo (audited separately, fase3-sdd sec. 7.5, D3).
  # The classpath files are placeholders so the guard boots; populate on deploy.
  url-denylist-path: classpath:security/onion-denylist.txt
  text-pattern-path: classpath:security/illegal-text-patterns.txt
  quarantine-retention-days: 30
