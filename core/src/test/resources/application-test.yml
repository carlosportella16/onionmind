spring:
  application:
    name: onionmind-core-test
  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password:
    hikari:
      # Overrides application.yml's Postgres-only "SET statement_timeout" — H2 doesn't
      # understand that syntax, this profile only runs CoreApplicationTests.
      connection-init-sql: "SELECT 1"
  flyway:
    enabled: false

server:
  port: 0
