services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: onionmind
      POSTGRES_USER: onionmind
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-onionmind_dev_only}
    ports: ["5432:5432"]
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U onionmind"]
      interval: 5s
      retries: 5

  redpanda:
    image: redpandadata/redpanda:v24.2.7
    command:
      - redpanda
      - start
      - --smp=1
      - --memory=512M
      - --overprovisioned
      - --node-id=0
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda:9092,external://localhost:19092
    ports: ["9092:9092", "19092:19092"]
    healthcheck:
      test: ["CMD", "rpk", "cluster", "info"]
      interval: 5s
      retries: 5

  # kafka_batch_max_bytes is a cluster-wide property, not a node/boot flag — `rpk redpanda
  # start --set` only applies node properties, so it has to be set after the cluster is up.
  # Default (1MiB) rejects real crawled .onion pages before they even reach the producer's
  # own MaxMessageBytes check — raised to match the crawler's max_page_size_mb=10 fetch
  # ceiling with headroom (fix-ingestion-stability).
  redpanda-config:
    image: redpandadata/redpanda:v24.2.7
    depends_on:
      redpanda:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command: ["rpk cluster config set kafka_batch_max_bytes 12582912 -X admin.hosts=redpanda:9644"]
    restart: "no"

  # Kafka UI for debugging only — not in the default `up` (and never on the VPS):
  # `docker compose --profile tools up -d redpanda-console`.
  redpanda-console:
    profiles: [tools]
    image: redpandadata/console:v2.7.2
    environment:
      KAFKA_BROKERS: redpanda:9092
    ports: ["8080:8080"]
    depends_on: [redpanda]

  redis:
    image: redis:7-alpine
    command: redis-server --maxmemory 128mb --maxmemory-policy allkeys-lru
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 5

  tor:
    build: ./tor
    ports: ["9050:9050"]
    # healthy = bootstrap finished, i.e. Tor can build circuits (fix-real-infra-findings D4)
    healthcheck:
      test: ["CMD", "grep", "-q", "Bootstrapped 100%", "/var/lib/tor/notices.log"]
      interval: 5s
      retries: 24
      start_period: 60s
    restart: unless-stopped

  # No AI service: generation comes from DeepSeek (set DEEPSEEK_API_KEY for the core) and
  # embeddings from the model the core runs itself (local-onnx-embeddings).

  qdrant:
    image: qdrant/qdrant:v1.11.0
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/6333' || exit 1"]
      interval: 5s
      retries: 5

  # Phase 4: knowledge graph. Community locally (no node limit); AuraDB Free in prod.
  neo4j:
    image: neo4j:5-community
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-onionmind_dev_only}
      # Sized for the 8 GB VPS (local-onnx-embeddings D9); the default heap grows to 1/4 of RAM.
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_pagecache_size: 256m
    ports: ["7474:7474", "7687:7687"]
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p \"$${NEO4J_AUTH#neo4j/}\" 'RETURN 1' || exit 1"]
      interval: 5s
      retries: 20
      start_period: 20s

volumes:
  pg_data:
  qdrant_data:
  neo4j_data:
