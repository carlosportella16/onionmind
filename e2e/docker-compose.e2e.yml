# End-to-end smoke stack (change crawler-integration-and-e2e-smoke, Neo4j since Fase 4). Everything external
# is faked by e2e-fakes — Tor (SOCKS5), the .onion sites and the AI providers (Gemini, DeepSeek)
# — so it runs with no network access to Tor or any AI provider, and the keys are fake.
# Run it through scripts/e2e-smoke.sh.
# Only the core's port is published, so it can run next to the dev docker-compose.yml
# as long as port 8081 is free.
name: onionmind-e2e

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: onionmind
      POSTGRES_USER: onionmind
      POSTGRES_PASSWORD: onionmind_dev_only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U onionmind"]
      interval: 2s
      retries: 30

  redpanda:
    image: redpandadata/redpanda:v24.2.7
    command:
      - redpanda
      - start
      - --smp=1
      - --memory=512M
      - --overprovisioned
      - --node-id=0
      - --kafka-addr=internal://0.0.0.0:9092
      - --advertise-kafka-addr=internal://redpanda:9092
    healthcheck:
      test: ["CMD", "rpk", "cluster", "info"]
      interval: 2s
      retries: 30

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      retries: 30

  qdrant:
    image: qdrant/qdrant:v1.11.0
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/6333' || exit 1"]
      interval: 2s
      retries: 30

  neo4j:
    image: neo4j:5-community
    environment:
      NEO4J_AUTH: neo4j/onionmind_dev_only
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p onionmind_dev_only 'RETURN 1' || exit 1"]
      interval: 2s
      retries: 60

  fakes:
    build:
      context: ../crawler
      dockerfile: ../e2e/Dockerfile.fakes
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 1080 && nc -z localhost 8080 && nc -z localhost 8090"]
      interval: 2s
      retries: 30

  core:
    image: eclipse-temurin:25-jre
    command:
      - java
      - -jar
      - /app/core.jar
      - --spring.datasource.url=jdbc:postgresql://postgres:5432/onionmind
      - --spring.kafka.bootstrap-servers=redpanda:9092
      - --spring.data.redis.host=redis
      - --ai.gemini.base-url=http://fakes:8090/v1beta
      - --ai.gemini.api-key=e2e-fake-key
      - --ai.openai-compatible.deepseek.base-url=http://fakes:8090
      - --ai.openai-compatible.deepseek.api-key=e2e-fake-key
      - --qdrant.url=qdrant
      - --embedding.dimensions=64
      - --embedding.enabled=true
      - --embedding.backfill-interval-ms=5000
      - --ai.enabled=true
      - --ai.backfill.interval-ms=5000
      - --illegal-content.url-denylist-path=file:/e2e/denylist.txt
      - --graph.enabled=true
      - --spring.neo4j.uri=bolt://neo4j:7687
    volumes:
      - ../core/build/libs/core-0.0.1-SNAPSHOT.jar:/app/core.jar:ro
      - ./denylist.txt:/e2e/denylist.txt:ro
    ports: ["8081:8081"]
    depends_on:
      postgres: { condition: service_healthy }
      redpanda: { condition: service_healthy }
      redis: { condition: service_healthy }
      qdrant: { condition: service_healthy }
      neo4j: { condition: service_healthy }
      fakes: { condition: service_healthy }

  # The real crawler image (crawler/Dockerfile), pointed at the fake Tor.
  crawler:
    build:
      context: ../crawler
    volumes:
      - ./crawler-config.yaml:/config.yaml:ro
    depends_on:
      redpanda: { condition: service_healthy }
      redis: { condition: service_healthy }
      fakes: { condition: service_healthy }
